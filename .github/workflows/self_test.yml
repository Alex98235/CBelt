name: Self-Tests

on:
  pull_request:
    branches: [main]

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run self-tests
        run: scripts/SelfTest.sh

  windows:
    name: Windows (UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
      - name: Run self-tests
        run: bash scripts/SelfTest.sh
